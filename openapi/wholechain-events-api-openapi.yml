openapi: 3.2.0
info:
  title: Wholechain Events API
  version: v1
  contact:
    url: https://www.connect.wholechain.com
  description: 'Operations tagged Events across 2 of this provider''s published API definitions: wholechain-connect-swagger.json, wholechain-openapi.yml. Each path carries the servers of the definition it was published in.'
servers:
- url: https://connect.wholechain.com
  description: Production (Swagger UI host per https://developers.wholechain.com/GettingStarted/Swagger/)
- url: https://connect-sandbox.wholechain.com
  description: Sandbox
tags:
- name: Events
paths:
  /epcis/Events/details:
    get:
      tags:
      - Events
      summary: Return a list of events details for the supply chain
      operationId: ListEventDetails
      parameters:
      - name: LotSerial
        in: query
        schema:
          type: string
      - name: PurchaseOrder
        in: query
        schema:
          type: string
      - name: PerformTraceback
        in: query
        schema:
          type: boolean
      - name: PageNumber
        in: query
        schema:
          type: integer
          format: int32
      - name: PageSize
        in: query
        schema:
          type: integer
          format: int32
      - name: SortBy
        in: query
        schema:
          type: string
      - name: X-API-KEY
        in: header
        schema:
          type: string
      responses:
        '200':
          description: OK
          content:
            text/plain:
              schema:
                $ref: '#/components/schemas/Wholechain.API.Contracts.Events.Responses.PaginatedEventDetailsResponse'
            application/json:
              schema:
                $ref: '#/components/schemas/Wholechain.API.Contracts.Events.Responses.PaginatedEventDetailsResponse'
            text/json:
              schema:
                $ref: '#/components/schemas/Wholechain.API.Contracts.Events.Responses.PaginatedEventDetailsResponse'
            application/xml:
              schema:
                $ref: '#/components/schemas/Wholechain.API.Contracts.Events.Responses.PaginatedEventDetailsResponse'
            text/xml:
              schema:
                $ref: '#/components/schemas/Wholechain.API.Contracts.Events.Responses.PaginatedEventDetailsResponse'
