openapi: 3.2.0
info:
  title: Wholechain Connect API
  version: v1
  contact:
    url: https://www.connect.wholechain.com
  description: 'Operations tagged Connect across 2 of this provider''s published API definitions: wholechain-connect-swagger.json, wholechain-openapi.yml. Each path carries the servers of the definition it was published in.'
servers:
- url: https://connect.wholechain.com
  description: Production (Swagger UI host per https://developers.wholechain.com/GettingStarted/Swagger/)
- url: https://connect-sandbox.wholechain.com
  description: Sandbox
tags:
- name: Connect
