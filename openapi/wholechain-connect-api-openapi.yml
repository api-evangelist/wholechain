    post:
      tags:
      - Connect
      operationId: XML
      parameters:
      - name: X-API-KEY
        in: header
        schema:
          type: string
      requestBody:
        content:
          application/xml:
            schema:
              type: array
              items: {}
          text/xml:
            schema:
              type: array
              items: {}
      responses:
        '200':
          description: OK
      summary: XML
      x-summary-source: derived
  /Integration/Events:
