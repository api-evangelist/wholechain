aid: wholechain

name: Wholechain

description: Wholechain (Wholechain, Inc.) is a blockchain-based supply chain traceability platform built to enable trust, coordination, and transparency
  in fragmented supply chains. It helps businesses map and capture supply chain events from origin to final delivery on mobile, tablet or desktop,
  share interoperable traceability records with partners using global data standards such as GS1 and GDST, verify origins down to the farm, fishery
  or vessel, reduce compliance burdens, and integrate with ERP and warehouse systems through a developer API documented at developers.wholechain.com.

